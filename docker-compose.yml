services:
  # PostgreSQL Database for Kong
  kong-database:
    image: postgres:13
    container_name: kong-database
    environment:
      POSTGRES_USER: kong
      POSTGRES_DB: kong
      POSTGRES_PASSWORD: kong
    volumes:
      - kong-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kong"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Kong API Gateway
  kong:
    image: kong:3.4.2
    container_name: kong
    depends_on:
      kong-database:
        condition: service_healthy
    restart: unless-stopped
    environment:
      KONG_DATABASE: postgres
      KONG_PG_HOST: kong-database
      KONG_PG_USER: kong
      KONG_PG_PASSWORD: kong
      KONG_PG_DATABASE: kong
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    ports:
      - "8000:8000"    # Proxy HTTP
      - "8443:8443"    # Proxy HTTPS
      - "8001:8001"    # Admin API HTTP
      - "8444:8444"    # Admin API HTTPS
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: bash -lc '
      echo "Waiting for PostgreSQL...";
      while ! bash -c "</dev/tcp/kong-database/5432" >/dev/null 2>&1; do sleep 1; done;
      kong migrations bootstrap || kong migrations up;
      kong start'

  # Konga - PostgreSQL Database for Konga
  konga-database:
    image: postgres:11  
    container_name: konga-database
    environment:
      POSTGRES_USER: konga
      POSTGRES_PASSWORD: konga
      POSTGRES_DB: konga
    ports:
      - "5433:5432"
    volumes:
      - konga-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "konga"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Konga - Kong Admin Dashboard (Optional)
  konga:
    image: pantsel/konga:latest
    container_name: konga
    depends_on:
      kong:
        condition: service_healthy
      konga-database:
        condition: service_healthy
    environment:
      NODE_ENV: development  
      DB_ADAPTER: postgres
      DB_HOST: konga-database
      DB_PORT: 5432
      DB_USER: konga
      DB_PASSWORD: konga
      DB_DATABASE: konga
    ports:
      - "1337:1337"    # Konga Admin UI
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:1337"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  kong-db-data:
  konga-db-data:

networks:
  default:
    name: kong-network
